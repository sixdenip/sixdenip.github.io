<header class="site-header">
  <div class="container">
    <div class="nav-wrapper">
      <a href="#hero" class="site-brand">
        <div class="brand-avatar-mini">PLS</div>
        <span class="brand-title">{{ site.author }}</span>
      </a>

      {% assign sorted_sections = site.sections | sort: "order" %}
      <ul class="nav-links" id="navLinks">
        {% for sec in sorted_sections %}
          {% if sec.enabled != false %}
            <li>
              <a href="#{{ sec.section_id }}" class="nav-link" data-i18n="nav.{{ sec.section_id }}">
                {{ sec.nav_title | default: sec.title }}
              </a>
            </li>
          {% endif %}
        {% endfor %}
        <li>
          <a href="{{ site.cv_pdf_url | default: '/assets/resume-pierre-louis-sixdenier.pdf' | relative_url }}" target="_blank" rel="noopener" class="nav-link" style="font-weight: 600;" data-i18n="nav.resume_pdf_link">
            Resume (PDF) ↗
          </a>
        </li>
      </ul>

      <div class="nav-actions">
        <!-- Language Switcher (Top Corner: EN, FR, DE) -->
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Language selector">
          <button type="button" class="lang-btn active" data-lang="en" aria-label="English" title="English">EN</button>
          <button type="button" class="lang-btn" data-lang="fr" aria-label="Français" title="Français">FR</button>
          <button type="button" class="lang-btn" data-lang="de" aria-label="Deutsch" title="Deutsch">DE</button>
        </div>

        <!-- Resume PDF Button -->
        <a href="{{ site.cv_pdf_url | default: '/assets/resume-pierre-louis-sixdenier.pdf' | relative_url }}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" title="Open Resume PDF (Black & White)">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span data-i18n="nav.resume_pdf">Resume (PDF)</span>
        </a>

        <!-- Dark/Light Theme Toggle -->
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
          <!-- Moon icon (for dark mode) -->
          <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <!-- Sun icon (for light mode) -->
          <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <!-- Mobile Menu Toggle Button -->
        <button id="mobileToggle" class="mobile-toggle" aria-label="Toggle navigation menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>
