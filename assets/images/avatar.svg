<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer background circle with subtle gradient border -->
  <circle cx="100" cy="100" r="96" fill="#0f172a" stroke="url(#avatarGrad)" stroke-width="3" />
  
  <!-- Subtle decorative tech grid dots/rings -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#334155" stroke-dasharray="4 6" stroke-width="1.5" opacity="0.6" />
  <circle cx="100" cy="100" r="68" fill="url(#haloGrad)" opacity="0.4" />

  <!-- Initials typography: P-L S -->
  <text x="100" y="112" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="-1.5"
        fill="#f8fafc" 
        text-anchor="middle"
        filter="url(#softGlow)">
    PLS
  </text>
  
  <!-- Small badge at bottom -->
  <g transform="translate(100, 158)">
    <rect x="-38" y="-12" width="76" height="24" rx="12" fill="#1e293b" stroke="url(#avatarGrad)" stroke-width="1.5" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">PhD CAND.</text>
  </g>
</svg>
